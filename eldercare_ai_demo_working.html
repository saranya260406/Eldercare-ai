renBtn');\n\n    let pressTimer = null;\n    let progressInterval = null;\n    let holdDuration = 3000;\n    let elapsed = 0;\n    let countdownTimer = null;\n    let remainingCountdown = 5;\n    let sirenActive = false;\n\n    const circumference = 2 * Math.PI * 72; // ~452.39\n\n    function resetHold() {\n      clearInterval(progressInterval);\n      clearTimeout(pressTimer);\n      elapsed = 0;\n      progressCircle.style.strokeDashoffset = circumference;\n      instruction.textContent = \"Press & hold firmly to trigger\";\n      pulseRing.classList.add('animate-ping');\n      sosBtn.classList.remove('scale-110');\n    }\n\n    function startHold(e) {\n      if (e) e.preventDefault();\n      resetHold();\n      pulseRing.classList.remove('animate-ping');\n      sosBtn.classList.add('scale-110');\n      instruction.textContent = \"Keep holding...\";\n\n      const step = 50;\n      progressInterval = setInterval(() => {\n        elapsed += step;\n        const progress = Math.min(elapsed / holdDuration, 1);\n        const offset = circumference - (progress * circumference);\n        progressCircle.style.strokeDashoffset = offset;\n\n        if (elapsed >= holdDuration) {\n          triggerEmergencyDispatch();\n          resetHold();\n        }\n      }, step);\n    }\n\n    function triggerEmergencyDispatch() {\n      // Vibrate if supported\n      if (navigator.vibrate) {\n        navigator.vibrate([300, 100, 300, 100, 600]);\n      }\n      countdownBanner.classList.remove('hidden');\n      countdownBanner.classList.add('flex');\n      remainingCountdown = 5;\n      countdownSec.textContent = remainingCountdown;\n\n      clearInterval(countdownTimer);\n      countdownTimer = setInterval(() => {\n        remainingCountdown--;\n        if (remainingCountdown >= 0) {\n          countdownSec.textContent = remainingCountdown;\n        }\n        if (remainingCountdown <= 0) {\n          clearInterval(countdownTimer);\n          countdownSec.textContent = \"SENT\";\n   // Load and Render Medications from SQLite Database
  function loadDbMeds() {
    fetch('/api/medications').then(r => r.json()).then(meds => {
      renderMedsList(meds);
    }).catch(() => {
      const localMeds = JSON.parse(store.getItem('ec-demo-medicines')||'[]');
      renderMedsList(localMeds);
    });
  }

  function renderMedsList(meds) {
    const main=document.querySelector('main'); if(!main) return;
    let box=document.getElementById('ec-added-medicines');
    if(!box && meds.length){
      box=document.createElement('section');
      box.id='ec-added-medicines';
      box.style.cssText='background:#fff;border-radius:16px;padding:16px;margin:12px 0;box-shadow:0 3px 14px #1232';
      const btn=[...document.querySelectorAll('button')].find(b=>(b.innerText||'').toLowerCase().includes('add medicine manually') || (b.innerText||'').toLowerCase().includes('add medicine'));
      (btn?.parentElement||main).insertBefore(box,btn?.parentElement?.firstChild||null);
    }
    if(box){
      box.innerHTML='<h3 style="margin:0 0 10px;color:#00646f">Medicines in SQLite Database</h3>'+meds.map(m=>'<div style="padding:10px 0;border-top:1px solid #e5ecee;display:flex;justify-content:space-between;gap:10px;align-items:center"><div><b>'+(m.tamilName||m.name)+'</b><div style="font-size:13px;color:#60757a;margin-top:4px">'+(m.timing||m.time||'')+' • Stock: '+(m.stock??10)+'</div></div><button type="button" data-med-toggle="'+m.id+'" style="border:0;border-radius:10px;padding:9px 12px;background:'+(m.takenToday||m.taken?'#d8f4e4':'#00646f')+';color:'+(m.takenToday||m.taken?'#155e38':'white')+';cursor:pointer;">'+(m.takenToday||m.taken?'Taken ✓':'Mark taken')+'</button></div>').join('');
      
      box.querySelectorAll('[data-med-toggle]').forEach(btn=>btn.addEventListener('click',()=>{
        const medId = btn.dataset.medToggle;
        fetch('/api/medications/' + medId + '/take', { method: 'PATCH' })
          .then(r => r.json())
          .then(res => {
            toast(res.message || 'Updated in SQLite Database!');
            loadDbMeds();
          }).catch(() => {
            toast('Marked locally.');
          });
      }));
    }
  }

  document.addEventListener('click', function(e){
    const b = e.target.closest('#markTakenBtn') || e.target.closest('#btn-mark-taken');
    if (b) {
      fetch('/api/medications').then(r => r.json()).then(list => {
        if (list && list.length) {
          fetch('/api/medications/' + list[0].id + '/take', { method: 'PATCH' })
            .then(r => r.json())
            .then(res => toast(res.message || 'Marked in SQLite Database!'))
            .catch(() => toast('Marked as taken.'));
        }
      }).catch(() => toast('Dose status updated.'));
    }
  });

  loadDbMeds();
})();
<\/script>`;
  return allPages[index].replace('</body>', navScript + '</body>');
}

function showPage(index) {
  if (index < 0 || index >= allPages.length) index = 0;
  frame.srcdoc = buildPage(index);
  document.querySelectorAll('.tab').forEach((b,i)=>b.classList.toggle('active',i===index));
  frame.title = titles[index];
  try { history.replaceState(null, '', '#'+index); } catch(e) {}
}

window.addEventListener('message', function(e) {
  if (!e.data || e.data.type !== 'eldercare-route') return;
  const index = routeMap[e.data.path];
  if (typeof index === 'number') showPage(index);
});

document.addEventListener('click', function(e){
  const tab = e.target.closest('.tab');
  if (tab) showPage(Number(tab.dataset.index));
});

showPage(0);

</script>
